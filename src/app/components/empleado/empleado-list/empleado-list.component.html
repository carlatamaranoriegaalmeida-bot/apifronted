<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Cargo</th>
      <th>Departamento</th>
      <th>Salario</th>
      <th>Operaciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let employee of employees">
      <td>{{ employee.name }}</td>
      <td>{{ employee.position }}</td>
      <td>{{ employee.department }}</td>
      <td>{{ employee.salary | currency }}</td>
      <td>
        <button class="btn btn-secondary btn-sm me-1" type="button" (click)="edit.emit(employee)">Actualizar</button>
        <button class="btn btn-danger btn-sm" type="button" (click)="delete.emit(employee)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
