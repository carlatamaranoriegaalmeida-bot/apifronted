<div class="row">
  <div class="col-md-4">
    <app-empleado-form
      [employee]="employeeForm"
      [editing]="!!editingEmployeeId"
      [errorMessage]="errorMessage"
      [successMessage]="successMessage"
      (save)="saveEmployee($event)"
      (cancel)="cleanForm()">
    </app-empleado-form>
  </div>

  <div class="col-md-8">
    <app-empleado-list
      *ngIf="empleados$ | async as empleados"
      [employees]="empleados"
      (edit)="updateEmployee($event)"
      (delete)="deleteEmployee($event)">
    </app-empleado-list>
  </div>
</div>
