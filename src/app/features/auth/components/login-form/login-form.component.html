<section class="login-card" aria-labelledby="login-form-title">
 <h2 id="login-form-title">Iniciar sesión</h2>
 <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
   <div class="field-group">
     <label class="field-label" for="login-email">Correo electrónico</label>
     <input
       id="login-email"
       type="email"
       class="form-control"
       [(ngModel)]="formModel.email"
       name="email"
       autocomplete="username"
       placeholder="nombre@empresa.com"
       required
       email
       [disabled]="isLoading">
   </div>
   <div class="field-group">
     <label class="field-label" for="login-password">Contraseña</label>
     <input
       id="login-password"
       type="password"
       class="form-control"
       [(ngModel)]="formModel.password"
       name="password"
       autocomplete="current-password"
       placeholder="Escribe tu contraseña"
       required
       [disabled]="isLoading">
   </div>
   <button type="submit" class="button button-primary" [disabled]="isLoading || loginForm.invalid">
     {{ isLoading ? 'Iniciando sesión…' : 'Iniciar sesión' }}
   </button>
 </form>
</section>
